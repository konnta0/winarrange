[package]
name = "winarrange"
version = "0.2.0"
edition = "2021"
rust-version = "1.85"
description = "On-demand window arrangement for macOS and Windows"
license = "MIT"
repository = "https://github.com/konnta0/winarrange"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.0"

[profile.release]
lto = "thin"
strip = true
