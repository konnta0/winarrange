[package]
name = "winarrange"
version = "0.7.0"
edition = "2021"
rust-version = "1.85"
description = "On-demand window arrangement for macOS and Windows"
license = "MIT"
repository = "https://github.com/konnta0/winarrange"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.0"

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
global-hotkey = "0.8"
interprocess = "2.4"
winit = "0.30"

[profile.release]
lto = "thin"
strip = true
