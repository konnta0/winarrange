gap = 8
margin = 4
# default_profile = "unity"

[profile.unity]
process = "Unity"
layout = "grid"
sort = "title"
columns = 2
gap = 12

[[profile.unity.slot]]
title = "Server"
position = 0

[[profile.unity.slot]]
title = "Client-01"
position = 1

[profile.browser]
process = "Google Chrome"
layout = "grid"
sort = "title"

[[ignore]]
type = "process"
value = "Calculator"

# No global hotkeys are registered unless entries are explicitly configured.
[[hotkey]]
keys = "cmd+shift+a"
action = "arrange-focused"

[[hotkey]]
keys = "cmd+shift+space"
action = "toggle-float"

[[hotkey]]
keys = "cmd+shift+j"
action = "focus-next"

[[hotkey]]
keys = "cmd+shift+k"
action = "focus-prev"

[[hotkey]]
keys = "cmd+shift+u"
action = "profile"
profile = "unity"
